distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.5.1 comes from the Aliyun open-source mirror: the official
# services.gradle.org host is often unreachable from mainland China, and the
# wrapper's default 10s read timeout cannot survive a 134 MB download.
# Official fallback:
#   https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
distributionUrl=https\://mirrors.aliyun.com/gradle/distributions/v9.5.1/gradle-9.5.1-bin.zip
networkTimeout=120000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
